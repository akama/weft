name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            ocaml_compiler: "ocaml-variants.5.2.1+options,ocaml-option-musl,ocaml-option-static"
            artifact: weft-linux-x86_64
          - os: ubuntu-24.04-arm
            ocaml_compiler: "ocaml-variants.5.2.1+options,ocaml-option-musl,ocaml-option-static"
            artifact: weft-linux-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools pkg-config
          sudo apt-get install -y liburing-dev zlib1g-dev

      - name: Install OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml_compiler }}
          opam-local-packages: ""

      - name: Install OCaml deps
        run: opam install . --deps-only --yes

      - name: Build
        run: opam exec -- dune build

      - name: Test
        run: opam exec -- dune runtest

      - name: Verify static linking
        run: |
          ldd _build/default/bin/main.exe 2>&1 | grep -q "not a dynamic executable"
          echo "Binary is fully static"

      - name: Package binary
        run: |
          mkdir -p dist
          cp _build/default/bin/main.exe dist/weft
          cp _build/default/bin/gen_logs.exe dist/weft-gen-logs
          chmod +x dist/weft dist/weft-gen-logs
          tar czf ${{ matrix.artifact }}.tar.gz -C dist weft weft-gen-logs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.${GITHUB_RUN_NUMBER}"

          # Collect all tarballs
          mkdir -p release
          find artifacts -name '*.tar.gz' -exec cp {} release/ \;

          # Generate checksums
          cd release
          sha256sum *.tar.gz > SHA256SUMS
          cd ..

          # Create release
          gh release create "${TAG}" \
            --title "weft ${TAG}" \
            --generate-notes \
            release/*
