name: CI

on:
  push:
    branches: [main, trunk]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            ocaml_compiler: "ocaml-variants.5.2.1+options,ocaml-option-musl,ocaml-option-static"
            static: true
          - os: ubuntu-24.04-arm
            ocaml_compiler: "ocaml-variants.5.2.1+options,ocaml-option-musl,ocaml-option-static"
            static: true
          - os: macos-latest
            ocaml_compiler: "5.2.1"
            static: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools pkg-config liburing-dev

      - name: Build static zlib for musl (Linux)
        if: runner.os == 'Linux'
        run: |
          cd /tmp
          curl -sL -o zlib.tar.gz "https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz"
          tar xzf zlib.tar.gz && cd zlib-1.3.1
          CC=musl-gcc ./configure --static --prefix=/usr
          make -j$(nproc)
          sudo make install
          # Ensure musl sysroot has linux kernel headers
          sudo ln -sf /usr/include/linux $(dirname $(musl-gcc -print-libgcc-file-name))/../include/linux 2>/dev/null || true
          sudo ln -sf /usr/include/asm $(dirname $(musl-gcc -print-libgcc-file-name))/../include/asm 2>/dev/null || true
          sudo ln -sf /usr/include/asm-generic $(dirname $(musl-gcc -print-libgcc-file-name))/../include/asm-generic 2>/dev/null || true

      - name: Install OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml_compiler }}
          opam-local-packages: ""

      - name: Install OCaml deps
        run: |
          opam install . --deps-only --with-test --yes
          # Install inotify on Linux (optional dep, needed for efficient file watching)
          if [ "$RUNNER_OS" = "Linux" ]; then opam install inotify --yes; fi

      - name: Build
        run: opam exec -- env ${{ matrix.static && 'WEFT_STATIC=1' || '_NOOP=1' }} dune build

      - name: Test
        run: opam exec -- env ${{ matrix.static && 'WEFT_STATIC=1' || '_NOOP=1' }} dune runtest

      - name: Verify static linking (Linux)
        if: runner.os == 'Linux'
        run: |
          ldd _build/default/bin/main.exe 2>&1 | grep -q "not a dynamic executable"
          echo "Binary is fully static"
