name: CI

on:
  push:
    branches: [main, trunk]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            ocaml_compiler: "ocaml-variants.5.2.1+options,ocaml-option-musl,ocaml-option-static"
            static: true
          - os: ubuntu-24.04-arm
            ocaml_compiler: "ocaml-variants.5.2.1+options,ocaml-option-musl,ocaml-option-static"
            static: true
          - os: macos-latest
            ocaml_compiler: "5.2.1"
            static: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare musl sysroot (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev pkg-config linux-headers-generic zlib1g-dev

          # Find musl include dir from specs file
          SPECS=$(find /usr -name musl-gcc.specs 2>/dev/null | head -1)
          echo "Found specs: $SPECS"
          MUSL_INC=$(grep -oP '(?<=-isystem )\S+' "$SPECS" | head -1)
          MUSL_PREFIX=$(dirname "$MUSL_INC")
          echo "MUSL_INC=$MUSL_INC  MUSL_PREFIX=$MUSL_PREFIX"

          # Symlink kernel headers into musl sysroot
          # On ARM, asm headers live under arch-specific dir
          sudo ln -sfn /usr/include/linux "$MUSL_INC/linux"
          sudo ln -sfn /usr/include/asm-generic "$MUSL_INC/asm-generic"
          if [ -d /usr/include/asm ]; then
            sudo ln -sfn /usr/include/asm "$MUSL_INC/asm"
          else
            # ARM Ubuntu: asm headers are under the multiarch dir
            ARCH_INC=$(find /usr/include -maxdepth 2 -name asm -type d 2>/dev/null | head -1)
            echo "Found arch asm headers: $ARCH_INC"
            sudo ln -sfn "$ARCH_INC" "$MUSL_INC/asm"
          fi

          # Verify headers are reachable
          ls "$MUSL_INC/linux/types.h" "$MUSL_INC/asm/types.h"

          # Build static zlib for musl
          cd /tmp
          curl -sL -o zlib.tar.gz "https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz"
          tar xzf zlib.tar.gz && cd zlib-1.3.1
          CC=musl-gcc ./configure --static --prefix="$MUSL_PREFIX"
          make -j$(nproc)
          sudo make install

          # Verify zlib is in musl sysroot
          ls "$MUSL_INC/zlib.h" "$MUSL_PREFIX/lib/libz.a"

      - name: Install OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml_compiler }}
          opam-local-packages: ""

      - name: Install OCaml deps
        run: |
          opam install . --deps-only --with-test --yes
          if [ "$RUNNER_OS" = "Linux" ]; then opam install inotify --yes; fi

      - name: Build
        run: opam exec -- env ${{ matrix.static && 'WEFT_STATIC=1' || '_NOOP=1' }} dune build

      - name: Test
        run: opam exec -- env ${{ matrix.static && 'WEFT_STATIC=1' || '_NOOP=1' }} dune runtest

      - name: Verify static linking (Linux)
        if: runner.os == 'Linux'
        run: |
          ldd _build/default/bin/main.exe 2>&1 | grep -q "not a dynamic executable"
          echo "Binary is fully static"
